<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Notes</title>
</head>
<body>
    <h1>Notes List</h1>
    <ul>
        {% for note in notes %}
            <li>
                <strong>{{ note.title }}</strong> ({{ note.created_at }})
                <p>{{ note.body }}</p>
            </li>
        {% empty %}
            <li>No notes yet.</li>
        {% endfor %}
    </ul>

</body>
</html>
